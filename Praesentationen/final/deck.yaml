meta:
  filename: Autoneum-Final_Aladdin
  title: The magic carpet
  subtitle: A luxury floor for premium ride services - warm, quiet, designed, and it swaps
    in seconds
  authors:
  - Aladdin and the Magic Carpet - Team 4
  event: Autoneum Challenge 2026 - Final
  date: '2026-09-11'
  footer_text: The magic carpet
  time_limit_seconds: 600
  core_message: |-
    Premium ride services are the target: a luxury floor - warm, quiet, designed - that swaps in seconds, so a cabin that works sixteen hours a day never has to be scrubbed inside the car. The private owner gets the same dock as a bonus.
  arc: |-
    Begin with the end: a winter evening, a fare steps out of the slush into a premium cabin that is already warm underfoot - nobody scrubbed it. Setup: the premium ride service is the customer, 2035, Europe; the private owner is named as a bonus and parked. Problem: strangers destroy floors and a premium fare rates what he sees. Unfair fight: cleaning is downtime. Hero: swap the contact layer, like a luxury hotel. The turn: a wipeable floor is a loud floor, and a premium cabin cannot be loud. Companion: Autoneum solved it outside the car. Resolution: one dock, three tiers - we build the top one, the cheaper ones fall out of it; luxury already heats surfaces and riders already pay a premium; on a long winter journey warmth earns its price. Payoff: fifty warm cabins a day, none scrubbed in the car. One more thing: the private owner gets the same dock. Close on the ask.
  references:
  - key: Autoneum deck 2026
    cite: V. Sansica, The Autoneum Challenge, ZHAW TAF, 7 Sep 2026 - product portfolio slides
      6-7 (light vs commercial vehicles), rules of the game slide 14
  - key: Autoneum brochure 2021
    cite: 'Autoneum, Product portfolio - Interior, Exterior, New Mobility, Autoneum Pure,
      Measurement Systems (July 2021): Alpha-Liner, RIMIC, Theta-Cell, Di-Light, Relive-1,
      Carpet Cleanability Analyzer'
  - key: Autoneum FY2025
    cite: Autoneum, Autoneum reports solid revenue, achieves strong EBIT margin of well above
      5 percent in fiscal year 2025, media release 23 Jan 2026 - revenue by Business Group
  - key: Autoneum AR 2024
    cite: Autoneum Annual Report 2024, Segment Information p. 99; Annual Report 2023 - Business
      Group revenue 2022-2024
  - key: Borgers 2023
    cite: Autoneum, media release on the acquisition of Borgers Automotive, effective 1 Apr
      2023, enterprise value EUR 117 m
  - key: Goldman Sachs 2026
    cite: Goldman Sachs Research, Robotaxis Are Forecast to Become a $400 Billion Market in
      2035, 30 Apr 2026 - fleet ~7,000 (2024) to ~6 m (2035)
  - key: Waymo ridership
    cite: TechCrunch, Waymo's skyrocketing ridership in one chart, 27 Mar 2026 (~500k paid
      rides/week); CNBC, Waymo crosses 450,000 weekly paid rides, 8 Dec 2025; fleet ~3,000-3,700
      vehicles
  - key: AAA 2019
    cite: AAA, Cold weather reduces electric vehicle range, Feb 2019 - range -41 % at 20 F
      / -7 C with heating on, -12 % without HVAC
  - key: US DOE 2024
    cite: 'US DOE Vehicle Technologies Office, Program Record: Impact of Cold Ambient Temperature
      on BEV Performance, 12 Sep 2024'
  - key: Radiant heaters 2024
    cite: Applied Thermal Engineering (ScienceDirect), Design and development of electric
      radiant heaters for local heating inside the cabin of electric vehicles, 2024 - ~200
      W radiant vs ~4.5 kW convective; battery draw 2.3 to 0.9 kW at 0 C
  - key: Radiant panels AV 2026
    cite: 'Energy and Buildings (ScienceDirect), Optimizing thermal comfort in highly automated
      vehicles: an AI-based HVAC management approach with radiant panels for winter conditions,
      2026 - neutral comfort ~3 C below setpoint with one radiant source, ~6 C with two'
  - key: Cleaning cost
    cite: 'Consumer detailing trade estimates (tech9autorepair, dbdautodetailing), 2025: basic
      interior clean 30-60 min, USD 60-150, heavy soiling 2-3x - not an automotive study;
      press reporting on Waymo fleet handlers and PPE, 2025'
  - key: Mercedes DRIVE PILOT
    cite: Mercedes-Benz Group, DRIVE PILOT approved for 95 km/h by the KBA, 17 Dec 2024 -
      first certified SAE L3 in series production (S-Class, EQS); USD 2,500/yr subscription
      in the US (InsideEVs 2023)
  - key: Uber-Lucid-Nuro
    cite: Lucid Motors / SEC 8-K, Lucid, Nuro and Uber partner on next-generation robotaxi
      program, Jul 2025 - USD 300 m investment, up to 20,000 Lucid Gravity over six years,
      launch 2026; Electrek 13 Apr 2026 on early test rides
  - key: Waymo vehicles
    cite: 'Waymo Blog, Meet our newest self-driving vehicle: the all-electric Jaguar I-PACE,
      Mar 2018 (base price ~USD 70,000); TechCrunch 19 Aug 2026 on the cheaper Zeekr-built
