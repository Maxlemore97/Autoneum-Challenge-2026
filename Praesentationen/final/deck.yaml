      backs); Rolls-Royce Motor Cars Boutique, Lambswool Floormats
  - key: Long-journey concepts
    cite: 'Volvo Cars Media, Volvo 360c: why fly when you can be driven?, Sep 2018 (~300 km
      routes vs short-haul flights); Mercedes-Benz F 015 Luxury in Motion, CES 2015; Cadillac
      InnerSpace, CES 2022'
  - key: Swiss ordinance
    cite: 'Swiss Federal Council ordinance on automated driving, in force 1 Mar 2025: L3 motorway
