- layout: metrics
  title: Heating the air is the single largest winter drain on an electric car
  metrics:
  - kicker: Resistive cabin heating
    value: 3-5 kW
    text: continuous, the largest cold-weather load
  - kicker: Range at -7 C, heating on
    value: -41 %
    text: AAA test across five EVs
  - kicker: Same cold, heating off
    value: -12 %
    text: the cabin is the difference
  cite: AAA, Cold weather reduces electric vehicle range, Feb 2019 (20 F / -7 C, five vehicles);
    US DOE VTO program record, Sep 2024
  beat: Problem
  seconds: 40
  notes: |-
    AAA put five electric cars on a dynamometer at minus seven degrees. Range fell by twelve percent from the cold itself - and by forty-one percent once the heating was on. The battery is not the problem. Heating two cubic metres of air with three to five kilowatts is. For a private commuter that is annoying. For a car that sells long journeys it is the business model.
- layout: statement
  kicker: The unfair fight
  title: On a 300-km journey that drain is a charging stop - and a premium fare waiting at
    a charger is a lost customer
  body: A car with 400 km of nominal range keeps about 240 with the heater on. Geneva to Winterthur
    is 300.
  cite: AAA 2019 (-41 % with heating at -7 C); road distance Geneva-Winterthur ~300 km
  beat: Unfair fight
  seconds: 35
  notes: |-
    Do the arithmetic the operator does. A four-hundred-kilometre car keeps about two hundred and forty with the heater running in winter. Geneva to Winterthur is three hundred. That is a charging stop - twenty minutes at a motorway plaza, in the cold, for a passenger who paid a premium not to have exactly that experience. Every winter journey over two hundred kilometres has this problem, and the premium tier is where it costs most.
- layout: image-right
  id: lounge-lux
  title: Blown air is the wrong tool for a lounge
  lead: Climate control is built around a dashboard. The dashboard is gone.
  bullets:
  - No fixed seats, so no vent points at anyone
  - Dry, noisy, and gone at every door
  - 'Two warm surfaces: neutral comfort 6 C lower'
  image_query: luxury driverless lounge no dashboard
  image_prompt: 'Rear cabin of a large luxury electric SUV in the class of a Lucid Gravity
    - long, low, sleek, a full glass roof, flush door handles, no badges: two wide reclining
    rear seats in cream leather turned slightly toward each other, no dashboard or steering
    wheel in view, deep cream lambswool-look floor, soft warm light from below the seats,
    one passenger in a wool coat with shoes off and feet on the floor, relaxed, a winter landscape
    blurred through the glass roof'
  image_style: cinematic photorealistic interior photography, low-key warm lighting, cream
    leather, dark open-pore wood, deep lambswool-look floor, muted palette with one warm accent,
    no text, no logos, no badges, no watermark
  image_role: shows why a vent cannot serve this cabin and a floor can
  cite: Energy and Buildings 2026 - neutral comfort ~6 C below setpoint with two radiant sources
  beat: Unfair fight
  seconds: 40
  notes: |-
    Every heating system in a car today is designed around the dashboard and the driver's seat. Take the driver out and the seats turn to face each other, or fold flat - there is no reliable place to point a vent. Blown air is also dry, it is noisy, and it is gone every time a door opens. Whereas with two warm surfaces around them, people report neutral comfort with the air six degrees colder. That is the study, not us.
- layout: image-full
  id: thermal
  title: 'Heat the passenger, not the air: 200 W instead of 4,500'
  body: The S-Class already heats its armrests. Rolls-Royce sells the mat as a signature.
    Nobody has heated the floor.
  image_query: thermal camera view warm floor cabin
  image_prompt: 'A thermal-camera style false-colour image of the rear cabin of a luxury SUV
    seen from the open door: the floor and the lower door panels glow warm orange and yellow,
    the passenger''s legs and the seat cushions pick up the warmth, while the air, the glass
    roof and the ceiling stay cool blue and violet; two wide rear seats clearly readable;
    no text, no scale bar, no logos'
  image_style: false-colour thermal imaging aesthetic, deep blue to orange gradient, soft
    edges, cinematic, no text, no numbers, no logos, no watermark
  image_role: makes radiant heating visible in one glance - warm surfaces, cool air
  cite: Applied Thermal Engineering 2024 (~200 W radiant vs ~4.5 kW convective); Mercedes-Benz
    Warmth Comfort; Rolls-Royce Boutique
  beat: Hero
  seconds: 45
  notes: |-
    So we stop heating the air. Radiant surfaces heat the person - around two hundred watts of warm floor and lower wall do what four and a half kilowatts of blown air do for comfort. And luxury already knows this: the S-Class has heated its armrests and door panels since 2014, warmth from all sides. Rolls-Royce sells lambswool floor mats as a signature piece. Nobody has put the two together on the floor. That is our product.
  video: assets/07-thermal-warmup.mp4
- layout: statement
  kicker: The harder problem
  title: But a heated floor is either loud or cold
  body: 'An acoustic absorber is a thermal insulator. Heater under it: the warmth goes into
    the body. Heater on top: it blocks the sound.'
  beat: The turn
  seconds: 35
  notes: |-
    Here the idea nearly died. The quiet in a premium cabin comes from an absorber under the floor - open, porous, and therefore an excellent insulator. Put the heater underneath it and the warmth goes into the body structure, not the cabin. Put a normal heating foil on top and you have sealed the absorber: a warm floor that is loud. On a three-hour journey, loud is the thing you cannot sell.
- layout: table
  title: Autoneum already makes every layer of it
  head:
  - The layer
  - Autoneum has
  - Where it sits today
  rows:
  - - Heating layer
    - (Heated) floor mats
    - Trucks
  - - Absorber
    - Hybrid-Acoustics PET
    - Interior floor
  - - Coated yet acoustic
    - Alpha-Liner
    - Wheelhouse, outside
  - - Absorb through a closed skin
    - RIMIC micro-perforation
    - Heatshields
  - - Premium surface
    - Di-Light, Relive-1
    - Interior floor
  cite: Autoneum Challenge deck, 7 Sep 2026, slides 6-7; Autoneum product brochure 2021
  beat: Companion
  seconds: 45
  notes: |-
    The answer is an order of layers, and Autoneum owns every one. Heated floor mats exist in the truck portfolio. Hybrid-Acoustics is the absorber. Alpha-Liner proves a coated textile can still absorb - the porosity is tuned through the coating. RIMIC proves you can absorb through a closed skin with a tuned micro-perforation. Di-Light and Relive-1 are the premium surfaces. Nothing here is invented. It has never been stacked.
