  - key: Obi pricing
    cite: Obi ride-hail price study, Business Insider Oct 2025 (Waymo 30-40 % above Uber/Lyft,
      Jun 2025); TechCrunch 27 Jan 2026 (Waymo USD 19.69 vs Uber 17.47 vs Lyft 15.47, 94,000
      ride requests, SF Bay Area)
  - key: McKinsey WTP
    cite: 'McKinsey Center for Future Mobility, Consumer Survey 2022 (n = 30,897): 50 % of
      interested buyers would pay up to ~USD 10,000 for an L4 highway pilot'
  - key: Luxury heated surfaces
    cite: Gentherm press release, Heated armrests featured in the 2014 Mercedes-Benz S-Class;
