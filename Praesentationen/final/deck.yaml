  title: A luxury surface has to stay luxury - so it lifts out in seconds
  lead: Serviced off the car. Never scrubbed inside it.
  bullets:
  - Lambswool for winter, linen-look for summer
  - Magnetic dock, no tools, thirty seconds
  - The same dock in a private car - later
  image_query: luxury floor mat lifted from premium footwell
  image_prompt: One hand in a wool coat sleeve lifting a cream lambswool-look floor mat by
    a single corner out of the rear footwell of a large luxury electric SUV in the class of
    a Lucid Gravity - long, low, sleek, a full glass roof, flush door handles, no badges,
    cream leather and dark wood around, the mat tilted up about forty degrees so four flush
    circular magnet pads on its underside are visible, matching pads on the floor below, a
